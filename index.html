<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1a73e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<script>
(function () {
  var KEY = "checklist-theme";
  var stored = null;
  try { stored = localStorage.getItem(KEY); } catch (e) {}
  var dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  var t = dark ? "dark" : "light";
  var el = document.documentElement;
  el.dataset.theme = t; el.style.colorScheme = t;
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", dark ? "#0e1116" : "#ffffff");
})();
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #f1f3f4; --card: #ffffff; --text: #202124; --muted: #5f6368;
    --accent: #1a73e8; --line: #e0e0e0; --danger: #d93025;
    --hover: color-mix(in srgb, var(--accent) 12%, transparent);
    --surface: rgba(255,255,255,.82);
    --bg-glow: rgba(26,115,232,.10);
    --scrim: rgba(255,255,255,.82);
    --scrim-input: rgba(255,255,255,.60);
    --on-image: #202124;
    --edge-manual: #5f6368; --edge-manual-hover: #202124;
    --edge-tag: #9334e6; --edge-tag-hover: #6f1fb0;
    --conn-s:64%; --conn-l:42%; --edge-w:2px;
    --dot:color-mix(in srgb, var(--text) 12%, transparent);
    --glow-2:rgba(147,52,230,.08); --note-w:300px;
    --tag-s: 62%; --tag-l: 38%; --ring-a: .55;
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-pill: 999px;
    --shadow-1: 0 1px 2px rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.06);
    --shadow-2: 0 4px 10px rgba(0,0,0,.10), 0 12px 28px rgba(0,0,0,.10);
    --shadow-pop: 0 8px 30px rgba(0,0,0,.18);
    --t-fast: 120ms ease; --t-med: 180ms ease;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:#0e1116; --card:#1a1f27; --text:#e8eaed; --muted:#9aa0a6; --accent:#8ab4f8; --line:#2c323b; --danger:#f28b82;
    --hover: color-mix(in srgb, var(--accent) 18%, transparent);
    --surface: rgba(20,24,31,.72);
    --bg-glow: rgba(138,180,248,.08);
    --scrim: rgba(12,15,20,.72);
    --scrim-input: rgba(0,0,0,.35);
    --on-image: #f1f3f4;
    --edge-manual:#9aa0a6; --edge-manual-hover:#e8eaed;
    --edge-tag:#c58af9; --edge-tag-hover:#d7adfb;
    --conn-s:72%; --conn-l:68%; --glow-2:rgba(197,138,249,.07);
    --tag-s:70%; --tag-l:70%; --ring-a:.70;
    --shadow-1: 0 1px 2px rgba(0,0,0,.4), 0 2px 10px rgba(0,0,0,.35);
    --shadow-2: 0 6px 16px rgba(0,0,0,.45), 0 16px 40px rgba(0,0,0,.4);
    --shadow-pop: 0 10px 34px rgba(0,0,0,.55);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--surface); backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    border-bottom: 1px solid var(--line);
    padding: 14px clamp(16px,3vw,32px); display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 8px;
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    header { background: var(--card); }
  }
  header h1 { font-size: 18px; font-weight: 650; letter-spacing: -.01em; margin: 0; }
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .brand-mark{width:34px;height:34px;border-radius:9px;flex:none;}
  h1{font-size:18px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.1;}
  .brand-sub{margin:0;font-size:11.5px;color:var(--muted);letter-spacing:.01em;}
  .seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-pill);padding:3px;gap:2px;}
  .seg-btn{border:0;background:none;color:var(--muted);border-radius:var(--radius-pill);padding:7px 10px;cursor:pointer;display:inline-flex;}
  .seg-btn[aria-pressed="true"]{background:var(--accent);color:var(--bg);}
  .i,.icon-btn .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .btn .i{vertical-align:-3px;margin-right:6px;}
  .sprite{position:absolute;width:0;height:0;overflow:hidden;}
  @media (max-width:560px){.btn .i{margin-right:0;}.btn .btn-label{display:none;}.brand-sub{display:none;}}
  .btn {
    border: 1px solid var(--line); background: var(--card); color: var(--accent);
    border-radius: var(--radius-pill); padding: 8px 16px; font: inherit; font-weight: 550; cursor: pointer;
    transition: background var(--t-fast), box-shadow var(--t-fast), transform var(--t-fast);
  }
  .btn:hover { background: var(--hover); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.btn-primary { background: var(--accent); border-color: transparent; color: #fff; }
  .btn.btn-primary:hover { background: var(--accent); filter: brightness(1.05); }
  :root[data-theme="dark"] .btn.btn-primary { color: #0e1116; }
  .theme-toggle{display:inline-flex;align-items:center;justify-content:center;padding:8px;border-radius:var(--radius-pill);}
  .theme-toggle .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;}
  :root[data-theme="light"] .i-moon{display:none;}
  :root[data-theme="dark"] .i-sun{display:none;}
  .btn:focus-visible, .icon-btn:focus-visible, input:focus-visible,
  .swatch:focus-visible, .toggle:focus-visible, .clear:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .board {
    position: relative;
    background-image: radial-gradient(1200px 600px at 50% -10%, var(--bg-glow), transparent 70%),
      radial-gradient(900px 500px at 100% 0%, var(--glow-2), transparent 70%);
    background-repeat: no-repeat;
  }
  main {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px; padding: clamp(16px,3vw,32px); align-items: start;
  }
  main.map-mode{display:block;gap:0;padding:0;position:relative;width:var(--canvas-w,100%);height:var(--canvas-h,100%);}
  main.map-mode .note{position:absolute;width:var(--note-w);margin:0;}
  main.map-mode .note-grip{display:inline-flex;}
  .board.map{background-image:radial-gradient(1200px 600px at 50% -10%,var(--bg-glow),transparent 70%),radial-gradient(var(--dot) 1px,transparent 1px);background-size:auto,26px 26px;}
  .note.dragging{z-index:6;box-shadow:var(--shadow-2);}
  .note.dragging,.note.dragging *{cursor:grabbing;}
  .note-grip{display:none;align-items:center;justify-content:center;width:32px;height:32px;border:none;background:none;color:var(--muted);border-radius:50%;cursor:grab;touch-action:none;opacity:.5;flex:none;}
  .note-grip:hover,.note-grip:focus-visible{background:var(--hover);color:var(--accent);opacity:1;}
  @media (pointer:coarse){.note-grip{width:44px;height:44px;}}
  main.connecting .note-grip{pointer-events:none;opacity:.35;}
  .empty { color: var(--muted); grid-column: 1 / -1; text-align: center; margin: 72px auto; max-width: 420px; line-height: 1.5; }
  .empty strong { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; }
  .note {
    position: relative; z-index: 2;
    background-color: var(--card);
    background-image: linear-gradient(var(--tint, transparent), var(--tint, transparent));
    border-radius: var(--radius-lg); box-shadow: var(--shadow-1);
    transition: box-shadow var(--t-med);
    padding: 14px 16px 10px;
    --accent: #1a73e8;
  }
  .note:hover { box-shadow: var(--shadow-2); }
  .note.pop-open { z-index: 5; }
  .note.has-bg {
    background-image: linear-gradient(var(--scrim), var(--scrim)), var(--bg-img, none);
    background-size: cover; background-position: center;
  }
  .note.has-bg .add-input { background: var(--scrim-input); border-radius: var(--radius-sm); }
  .note.has-bg .add-input::placeholder { color: var(--on-image); }
  .note.has-bg .note-title,
  .note.has-bg .item-text { color: var(--on-image); }
  .note-head { display: flex; align-items: center; gap: 4px; }
  .note-title {
    flex: 1; min-width: 0; border: none; background: transparent; font: inherit;
    font-size: 16px; font-weight: 650; padding: 6px 4px; border-bottom: 2px solid transparent; outline: none;
    resize: none; overflow: hidden; display: block; line-height: 1.3;
    white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word;
  }
  .note-title:focus { border-bottom-color: var(--accent); }
  .note-tags {
    width: 100%; border: none; background: transparent; font: inherit; font-size: 12px;
    color: var(--muted); padding: 2px 4px 6px; outline: none;
  }
  .note-tags:focus { border-bottom: 1px solid var(--accent); }
  .tag-chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 4px 6px;}
  .tag-chip{--chip:hsl(var(--tag-h,216) var(--tag-s) var(--tag-l));font-size:11px;line-height:1;font-weight:650;padding:4px 8px;border-radius:var(--radius-pill);color:var(--chip);background:hsl(var(--tag-h,216) var(--tag-s) var(--tag-l)/.12);border:1px solid hsl(var(--tag-h,216) var(--tag-s) var(--tag-l)/.40);}
  :root[data-theme="dark"] .tag-chip{background:hsl(var(--tag-h,216) var(--tag-s) var(--tag-l)/.18);}
  .note:not(:focus-within) .note-tags:not(:placeholder-shown){position:absolute;opacity:0;pointer-events:none;}
  .item { display: flex; align-items: flex-start; gap: 10px; padding: 4px 0; }
  .item input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; flex: none; margin: 3px 0 0; }
  .item-text {
    flex: 1; min-width: 0; border: none; background: transparent; font: inherit;
    padding: 2px 0; outline: none; border-bottom: 1px solid transparent;
    resize: none; overflow: hidden; display: block; line-height: 1.35;
    white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word;
  }
  .item-text:focus { border-bottom-color: var(--accent); }
  .item.done .item-text { color: var(--muted); text-decoration: line-through; }
  .add-form { margin: 0; }
  .add-input {
    width: 100%; border: none; background: transparent; font: inherit; padding: 8px 0 8px 28px;
    color: var(--text); outline: none;
  }
  .add-input::placeholder { color: var(--muted); }
  .add-input:focus { border-bottom: 1px solid var(--accent); }
  .icon-btn {
    border: none; background: none; cursor: pointer; color: var(--muted); font-size: 16px;
    width: 32px; height: 32px; border-radius: var(--radius-sm); flex: none; opacity: .5;
  }
  .icon-btn:hover { background: var(--hover); color: var(--danger); opacity: 1; }
  .note-design:hover { background: var(--hover); color: var(--accent); opacity: 1; }
  .item:hover .icon-btn, .item:focus-within .icon-btn, .note:hover .note-head .icon-btn { opacity: 1; }
  .done-bar {
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px;
  }
  .toggle, .clear {
    border: none; background: none; cursor: pointer; color: var(--muted); font: inherit; font-size: 13px; padding: 6px 4px;
  }
  .toggle:hover, .clear:hover { color: var(--accent); }
  .actions { display: flex; gap: 8px; align-items: center; }
  .btn-secondary { color: var(--text); }

  /* --- Conexiones --- */
  #links {
    position: absolute; inset: 0; width: 100%; height: 100%;
    overflow: visible; pointer-events: none; z-index: 1;
  }
  .edge-line{stroke:var(--edge-c,var(--edge-manual));stroke-width:2;fill:none;stroke-linecap:round;transition:stroke-width var(--t-fast);}
  .edge-tag .edge-line{stroke-dasharray:7 5;}
  .edge-anchor{fill:var(--edge-c,var(--edge-manual));stroke:var(--card);stroke-width:1.5;}
  .edge-hit{stroke:transparent;stroke-width:28;fill:none;pointer-events:stroke;cursor:pointer;touch-action:manipulation;}
  .edge:hover .edge-line,.edge.selected .edge-line{stroke-width:3;}
  @media (pointer:coarse){.edge-hit{stroke-width:34;}}
  @media (prefers-reduced-motion:no-preference){
    .edge-new.edge-manual .edge-line{stroke-dasharray:1;stroke-dashoffset:1;animation:edge-draw .45s ease-out forwards;}
    .edge-new.edge-tag .edge-line{animation:edge-fade .3s ease-out both;}
    .edge-new .edge-anchor{animation:edge-fade .3s ease-out both;}
    @keyframes edge-draw{to{stroke-dashoffset:0;}}
    @keyframes edge-fade{from{opacity:0;}to{opacity:1;}}
  }
  main.connecting .note { cursor: crosshair; }

  /* --- Borde por conexión (grafo) --- */
  .note.has-edge::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:var(--edge-w);
    background:var(--edge-paint);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
    pointer-events:none;z-index:0;}
  @supports not ((mask-composite:exclude) or (-webkit-mask-composite:xor)){
    .note.has-edge{box-shadow:0 0 0 2px var(--edge-c1,var(--accent)),var(--shadow-1);}
    .note.has-edge::before{display:none;}}
  main.connecting .note.has-edge::before{opacity:.30;}
  .note.is-origin::before,.note.is-target::before{opacity:0;}
  .note.is-origin { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note.is-target { outline: 2px dashed var(--edge-tag); outline-offset: 2px; cursor: crosshair; }
  .note.is-target:hover { outline-style: solid; }

  /* --- Popover de estilo --- */
  .pop {
    position: absolute; top: 44px; right: 8px; z-index: 10;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-md);
    box-shadow: var(--shadow-pop); padding: 12px; width: 244px;
  }
  .pop-title { font-size: 11px; color: var(--muted); margin: 10px 0 6px; text-transform: uppercase; letter-spacing: .05em; }
  .pop-title:first-child { margin-top: 0; }
  .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .swatch {
    width: 100%; aspect-ratio: 1; border-radius: 50%; border: 2px solid transparent;
    background: var(--sw); cursor: pointer; padding: 0;
  }
  .swatch.swatch-none {
    border-color: var(--line);
    background-image: linear-gradient(to top right,
      transparent 45%, var(--muted) 45%, var(--muted) 55%, transparent 55%);
  }
  .swatch.selected { border-color: var(--text); box-shadow: 0 0 0 2px var(--card) inset; }
  .opacity-slider { width: 100%; accent-color: var(--accent); }
  .pop-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .pop-btn { padding: 6px 10px; font-size: 13px; }
  .bg-thumb {
    width: 38px; height: 38px; border-radius: 6px; background-size: cover; background-position: center;
    background-color: var(--line); border: 1px solid var(--line); flex: none;
  }
  .pop-links { max-height: 140px; overflow: auto; }
  .link-row { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
  .link-label { flex: 1; min-width: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .link-empty { font-size: 12px; color: var(--muted); margin: 2px 0; }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  @media (pointer: coarse) {
    .icon-btn { width: 44px; height: 44px; font-size: 18px; }
    .btn, .toggle, .clear { min-height: 44px; }
    .pop-btn { min-height: 40px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false" width="0" height="0">
  <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18h1.6a2 2 0 0 0 1.5-3.3 2 2 0 0 1 1.5-3.3H18a3 3 0 0 0 3-3A9 9 0 0 0 12 3z"/><circle cx="7.5" cy="12" r="1.1"/><circle cx="9.6" cy="8" r="1.1"/><circle cx="14" cy="7.4" r="1.1"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 1 0-6l2-2a4 4 0 0 1 6 6l-1 1"/><path d="M14 10a4 4 0 0 1 0 6l-2 2a4 4 0 0 1-6-6l1-1"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-grip" viewBox="0 0 24 24"><path d="M8 7h8M8 12h8M8 17h8"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-map" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="9" r="2.4"/><circle cx="10" cy="18" r="2.4"/><path d="M8 7l7 1M7.6 8.6l1.8 7M16.6 11l-5 5.4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 19h14"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 21V9M7 14l5-5 5 5M5 5h14"/></symbol>
</svg>
<header>
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 512 512" aria-hidden="true" focusable="false">
      <rect width="512" height="512" rx="96" fill="var(--accent)"/>
      <rect x="120" y="110" width="272" height="292" rx="28" fill="var(--card)"/>
      <path d="M170 236 l42 42 l92 -96" fill="none" stroke="var(--accent)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="brand-text"><h1>Checklist</h1><p class="brand-sub" id="stats">0 listas · 0 conexiones</p></div>
  </div>
  <div class="actions">
    <div class="seg" role="group" aria-label="Vista del tablero">
      <button class="seg-btn" id="view-grid" type="button" aria-pressed="true" aria-label="Vista cuadrícula"><svg class="i" aria-hidden="true"><use href="#i-grid"/></svg></button>
      <button class="seg-btn" id="view-map" type="button" aria-pressed="false" aria-label="Vista mapa"><svg class="i" aria-hidden="true"><use href="#i-map"/></svg></button>
    </div>
    <button class="btn theme-toggle" id="theme-toggle" type="button" aria-label="Activar modo oscuro" aria-pressed="false">
      <svg class="i i-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
      <svg class="i i-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg>
    </button>
    <button class="btn btn-secondary" id="export"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-down"/></svg><span class="btn-label">Exportar</span></button>
    <label class="btn btn-secondary" for="import-file"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-up"/></svg><span class="btn-label">Importar</span></label>
    <input type="file" id="import-file" accept="application/json" hidden>
    <button class="btn btn-primary" id="new-note"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-plus"/></svg><span class="btn-label">Nueva lista</span></button>
  </div>
</header>

<div class="board">
  <main id="notes"></main>
  <svg id="links" aria-hidden="true" focusable="false"></svg>
</div>
<p id="sr-status" role="status" aria-live="polite" class="visually-hidden"></p>
<p id="grip-help" class="visually-hidden">Pulsa las flechas para mover la lista; con Mayús, más distancia.</p>

<script>
  const KEY = "checklist-notas-v1";

  const PALETTE = [
    { bg: "#1a73e8", accent: "#1a73e8" }, // Azul
    { bg: "#d93025", accent: "#c5221f" }, // Rojo
    { bg: "#188038", accent: "#137333" }, // Verde
    { bg: "#f9ab00", accent: "#b06000" }, // Amarillo
    { bg: "#e8710a", accent: "#c5520a" }, // Naranja
    { bg: "#9334e6", accent: "#8430ce" }, // Morado
    { bg: "#00838f", accent: "#006a75" }, // Turquesa
    { bg: "#e52592", accent: "#c2185b" }, // Rosa
    { bg: "#5f6368", accent: "#3c4043" }, // Gris
    { bg: "#795548", accent: "#5d4037" }  // Marrón
  ];
  const COLOR_NAMES = ["Azul", "Rojo", "Verde", "Amarillo", "Naranja", "Morado", "Turquesa", "Rosa", "Gris", "Marrón"];

  let notes = load();
  let connectingSource = null;   // id de la nota origen en modo conexión
  let openPopId = null;          // id de la nota con popover abierto
  let popFocusKey = null;        // selector a enfocar tras render()
  const VIEW_KEY = "checklist-view";
  let viewMode = "grid";
  try { viewMode = localStorage.getItem(VIEW_KEY) === "map" ? "map" : "grid"; } catch (e) {}

  function uid() {
    return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  }

  function parseTags(v) {
    if (Array.isArray(v)) v = v.join(",");
    if (typeof v !== "string") return [];
    return [...new Set(v.split(",").map(t => t.trim().toLowerCase()).filter(Boolean))];
  }

  // Hash determinista (FNV-1a) de una cadena -> matiz 0..360.
  function hueFromString(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return (h * 137.508) % 360;
  }
  function tagHue(tag) { return hueFromString(tag); }
  function pairKey(a, b) { return a < b ? a + "|" + b : b + "|" + a; }
  function manualHue(a, b) { return hueFromString("m:" + pairKey(a, b)); }
  function connColor(hue) { return `hsl(${hue.toFixed(1)} var(--conn-s) var(--conn-l))`; }

  let tagCounts = new Map();
  function computeTagCounts() {
    tagCounts = new Map();
    notes.forEach(n => (n.tags || []).forEach(t => tagCounts.set(t, (tagCounts.get(t) || 0) + 1)));
  }
  // Primer tag de la nota compartido por >= 2 notas (para auto-conexión).
  function sharedTag(note) {
    return (note.tags || []).find(t => (tagCounts.get(t) || 0) >= 2) || null;
  }

  // Normaliza una nota al modelo actual sin perder datos.
  function normalizeNote(n) {
    if (!n || typeof n !== "object") n = {};
    n.id = typeof n.id === "string" && n.id ? n.id : uid();
    n.title = typeof n.title === "string" ? n.title : "";
    n.items = Array.isArray(n.items) ? n.items.map(it => {
      it = it && typeof it === "object" ? it : {};
      return {
        id: typeof it.id === "string" && it.id ? it.id : uid(),
        text: typeof it.text === "string" ? it.text : "",
        done: !!it.done
      };
    }) : [];
    n.showDone = n.showDone !== false;
    n.tags = parseTags(n.tags);
    n.links = Array.isArray(n.links) ? [...new Set(n.links.filter(x => typeof x === "string"))] : [];
    n.color = (Number.isInteger(n.color) && n.color >= 0 && n.color <= 9) ? n.color : null;
    n.opacity = (typeof n.opacity === "number" && n.opacity >= 0 && n.opacity <= 60) ? Math.round(n.opacity) : 18;
    n.bgId = typeof n.bgId === "string" && n.bgId ? n.bgId : null;
    n.pos = (n.pos && Number.isFinite(n.pos.x) && Number.isFinite(n.pos.y)) ? { x: Math.max(0, n.pos.x), y: Math.max(0, n.pos.y) } : null;
    return n;
  }

  function load() {
    try { return (JSON.parse(localStorage.getItem(KEY)) || []).map(normalizeNote); }
    catch { return []; }
  }

  let gcTimer = null;
  function save() {
    localStorage.setItem(KEY, JSON.stringify(notes));
    clearTimeout(gcTimer);
    gcTimer = setTimeout(() => { gcImages(); }, 2000);
  }

  // Crea nodos sin innerHTML: el texto del usuario nunca se interpreta como HTML.
  function el(tag, props = {}, children = []) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (k in n) n[k] = v;
      else n.setAttribute(k, v);
    }
    n.append(...children);
    return n;
  }

  function svgEl(tag, attrs = {}, children = []) {
    const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    children.forEach(c => n.append(c));
    return n;
  }

  function icon(id, cls = "i") {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", cls);
    svg.setAttribute("aria-hidden", "true");
    svg.setAttribute("focusable", "false");
    const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
    use.setAttribute("href", "#" + id);
    svg.append(use);
    return svg;
  }

  function announce(msg) {
    const s = document.getElementById("sr-status");
    if (s) s.textContent = msg;
  }

  // ---------- Tema (claro / oscuro) ----------
  const THEME_KEY = "checklist-theme";
  function applyTheme(t, persist) {
    const dark = t === "dark";
    const root = document.documentElement;
    root.dataset.theme = dark ? "dark" : "light";
    root.style.colorScheme = dark ? "dark" : "light";
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", dark ? "#0e1116" : "#ffffff");
    const btn = document.getElementById("theme-toggle");
    if (btn) {
      btn.setAttribute("aria-pressed", String(dark));
      btn.setAttribute("aria-label", dark ? "Activar modo claro" : "Activar modo oscuro");
    }
    if (persist) { try { localStorage.setItem(THEME_KEY, dark ? "dark" : "light"); } catch (e) {} }
    linksDirty = true;
    scheduleLinks();
  }

  // ---------- Color / opacidad ----------
  function hexToRgb(hex) {
    const h = hex.replace("#", "");
    return { r: parseInt(h.slice(0, 2), 16), g: parseInt(h.slice(2, 4), 16), b: parseInt(h.slice(4, 6), 16) };
  }
  function tintFor(note) {
    if (note.color == null) return "transparent";
    const c = PALETTE[note.color];
    const { r, g, b } = hexToRgb(c.bg);
    return `rgba(${r}, ${g}, ${b}, ${(note.opacity ?? 18) / 100})`;
  }
  function accentFor(note) {
    return note.color == null ? "#1a73e8" : PALETTE[note.color].accent;
  }

  // ---------- IndexedDB (imágenes) ----------
  const DB_NAME = "checklist-media";
  const DB_VERSION = 1;
  const STORE = "images";
  let dbPromise = null;

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STORE)) {
          const store = db.createObjectStore(STORE, { keyPath: "id" });
          store.createIndex("hash", "hash", { unique: true });
          store.createIndex("createdAt", "createdAt");
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }

  function reqP(request) {
    return new Promise((resolve, reject) => {
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async function sha256(blob) {
    const buf = await blob.arrayBuffer();
    const digest = await crypto.subtle.digest("SHA-256", buf);
    return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, "0")).join("");
  }

  async function putImage(blob, name) {
    const hash = await sha256(blob);
    const db = await openDB();
    const existing = await reqP(db.transaction(STORE, "readonly").objectStore(STORE).index("hash").get(hash));
    if (existing) return existing.id;
    const rec = { id: uid(), hash, blob, type: blob.type || "", name: name || "", size: blob.size, createdAt: Date.now() };
    try {
      await reqP(db.transaction(STORE, "readwrite").objectStore(STORE).put(rec));
    } catch (err) {
      if (err && err.name === "ConstraintError") {
        const ex = await reqP(db.transaction(STORE, "readonly").objectStore(STORE).index("hash").get(hash));
        if (ex) return ex.id;
      }
      throw err;
    }
    return rec.id;
  }

  async function getImage(id) {
    const db = await openDB();
    return reqP(db.transaction(STORE, "readonly").objectStore(STORE).get(id));
  }

  const urlCache = new Map(); // id -> objectURL
  async function getImageURL(id) {
    if (!id) return null;
    if (urlCache.has(id)) return urlCache.get(id);
    try {
      const rec = await getImage(id);
      if (!rec || !rec.blob) { urlCache.set(id, null); return null; }
      const url = URL.createObjectURL(rec.blob);
      urlCache.set(id, url);
      return url;
    } catch (e) {
      console.warn("getImageURL", e);
      return null;
    }
  }
  function revokeImageURL(id) {
    const url = urlCache.get(id);
    if (url) { URL.revokeObjectURL(url); urlCache.delete(id); }
  }
  function revokeIfUnused(id) {
    if (!id) return;
    if (notes.some(n => n.bgId === id)) return;
    revokeImageURL(id);
  }

  async function gcImages() {
    try {
      const db = await openDB();
      const used = new Set(notes.map(n => n.bgId).filter(Boolean));
      const keys = await reqP(db.transaction(STORE, "readonly").objectStore(STORE).getAllKeys());
      const toDelete = keys.filter(k => !used.has(k));
      if (!toDelete.length) return;
      const store = db.transaction(STORE, "readwrite").objectStore(STORE);
      toDelete.forEach(k => { store.delete(k); revokeImageURL(k); });
    } catch (e) { /* IndexedDB no disponible */ }
  }

  // ---------- Fondo por nota ----------
  async function applyBackground(section, note) {
    const thumb = section.querySelector(".bg-thumb");
    if (!note.bgId) {
      section.classList.remove("has-bg");
      section.style.removeProperty("--bg-img");
      if (thumb) thumb.style.backgroundImage = "";
      return;
    }
    const url = await getImageURL(note.bgId);
    if (!url) { section.classList.remove("has-bg"); return; }
    section.style.setProperty("--bg-img", `url("${url}")`);
    section.classList.add("has-bg");
    if (thumb) thumb.style.backgroundImage = `url("${url}")`;
  }

  function applyAllStyles() {
    const { incident } = connectionModel();
    document.querySelectorAll(".note").forEach(sec => {
      const note = notes.find(n => n.id === sec.dataset.id);
      if (!note) return;
      sec.style.setProperty("--tint", tintFor(note));
      sec.style.setProperty("--accent", accentFor(note));
      const hues = incident.get(note.id) || [];
      const paint = borderPaint(hues);
      if (paint) {
        sec.classList.add("has-edge");
        sec.style.setProperty("--edge-paint", paint);
        sec.style.setProperty("--edge-c1", connColor(hues[0]));
      } else {
        sec.classList.remove("has-edge");
        sec.style.removeProperty("--edge-paint");
        sec.style.removeProperty("--edge-c1");
      }
      applyBackground(sec, note);
    });
  }

  async function handleBgUpload(file, note) {
    if (!file.type.startsWith("image/")) { alert("Selecciona un archivo de imagen."); return; }
    if (file.size > 20 * 1024 * 1024 && !confirm("La imagen pesa más de 20 MB. ¿Continuar?")) return;
    const prev = note.bgId;
    try {
      const id = await putImage(file, file.name);
      note.bgId = id;
      save();
      if (prev && prev !== id) revokeIfUnused(prev);
      render();
    } catch (err) {
      note.bgId = prev;
      alert("Imagen demasiado grande o sin espacio.");
      console.warn("putImage", err);
    }
  }

  // ---------- Conexiones (grafo estilo Obsidian) ----------
  let linksDirty = false;
  let linksRAF = null;
  let prevEdgeKeys = null;   // claves de aristas del frame anterior (para animar solo las nuevas)
  let justLinked = null;     // key de la conexión manual recién creada

  // Modelo único del grafo: aristas manuales + por tag, con dedup y orden estable.
  function connectionModel() {
    const incident = new Map(); const edges = [];
    const push = (id, d) => { let a = incident.get(id); if (!a) { a = []; incident.set(id, a); } a.push(d); };
    const manualPairs = new Set();
    notes.forEach(n => (n.links || []).forEach(tid => {
      const pk = pairKey(n.id, tid);
      if (manualPairs.has(pk)) return;
      manualPairs.add(pk);
      const hue = manualHue(n.id, tid);
      edges.push({ key: "m:" + pk, type: "m", hue, a: n.id, b: tid, srcId: n.id, tid });
      push(n.id, { type: "m", hue, key: "m:" + pk });
      push(tid, { type: "m", hue, key: "m:" + pk });
    }));
    const byTag = new Map();
    notes.forEach(n => (n.tags || []).forEach(t => { let a = byTag.get(t); if (!a) { a = []; byTag.set(t, a); } a.push(n.id); }));
    const seen = new Set();
    byTag.forEach((ids, tag) => {
      for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
        const pk = pairKey(ids[i], ids[j]);
        if (seen.has(pk) || manualPairs.has(pk)) continue; // la conexión manual gana sobre la de tag
        seen.add(pk);
        const hue = tagHue(tag);
        edges.push({ key: "t:" + pk, type: "t", hue, a: ids[i], b: ids[j], srcId: null, tid: null });
        push(ids[i], { type: "t", hue, key: "t:" + pk });
        push(ids[j], { type: "t", hue, key: "t:" + pk });
      }
    });
    incident.forEach((arr, id) => {
      const uniq = new Map(); arr.forEach(x => uniq.set(x.key, x));
      const list = [...uniq.values()].sort((p, q) => (p.type === q.type ? 0 : p.type === "m" ? -1 : 1) || (p.hue - q.hue) || p.key.localeCompare(q.key));
      incident.set(id, list.map(x => x.hue));
    });
    return { edges, incident };
  }

  function borderPaint(hues) {
    if (!hues.length) return null;
    const c = hues.map(connColor);
    if (c.length === 1) return c[0];
    return `conic-gradient(from -90deg, ${c.concat(c[0]).join(", ")})`;
  }

  function scheduleLinks() {
    linksDirty = true;
    if (linksRAF == null) {
      linksRAF = requestAnimationFrame(() => { linksRAF = null; drawLinks(); });
    }
  }

  function makeMarker(id, color) {
    const m = svgEl("marker", {
      id, viewBox: "0 0 10 10", refX: "9", refY: "5",
      markerWidth: "6", markerHeight: "6", orient: "auto-start-reverse"
    });
    const p = svgEl("path", { d: "M0 0 L10 5 L0 10 z" });
    p.style.fill = color;
    m.append(p);
    return m;
  }

  function rectCenter(r) { return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }

  // Punto sobre el borde del rect apuntando hacia `toward`, retrocedido `margin` px.
  function borderPoint(r, toward, margin) {
    const c = rectCenter(r);
    const dx = toward.x - c.x, dy = toward.y - c.y;
    const w = r.width / 2, h = r.height / 2;
    let t = Infinity;
    if (dx !== 0) t = Math.min(t, w / Math.abs(dx));
    if (dy !== 0) t = Math.min(t, h / Math.abs(dy));
    if (!isFinite(t)) t = 0;
    const len = Math.hypot(dx, dy) || 1;
    return {
      x: c.x + dx * t - dx / len * margin,
      y: c.y + dy * t - dy / len * margin
    };
  }

  function makeEdge(r1, r2, cls, marker, srcId, tid, color) {
    const p1 = borderPoint(r1, rectCenter(r2), 8);
    const p2 = borderPoint(r2, rectCenter(r1), 8);
    const dx = p2.x - p1.x, dy = p2.y - p1.y, dist = Math.hypot(dx, dy) || 1;
    const ux = dx / dist, uy = dy / dist, nx = -uy, ny = ux;
    const bow = Math.min(0.18 * dist, 46);
    const c1x = p1.x + ux * dist * 0.35 + nx * bow * 0.6, c1y = p1.y + uy * dist * 0.35 + ny * bow * 0.6;
    const c2x = p2.x - ux * dist * 0.35 + nx * bow * 0.6, c2y = p2.y - uy * dist * 0.35 + ny * bow * 0.6;
    const d = `M ${p1.x} ${p1.y} C ${c1x} ${c1y} ${c2x} ${c2y} ${p2.x} ${p2.y}`;
    const g = svgEl("g", { class: "edge " + cls });
    if (color) g.style.setProperty("--edge-c", color);
    g.append(svgEl("circle", { class: "edge-anchor", cx: p1.x, cy: p1.y, r: 3 }));
    if (srcId != null) {
      const hit = svgEl("path", { d, class: "edge-hit" });
      hit.addEventListener("click", e => { e.stopPropagation(); deleteLink(srcId, tid); });
      g.append(hit);
    }
    g.append(svgEl("path", { d, class: "edge-line", "marker-end": marker, pathLength: "1" }));
    return g;
  }

  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function drawLinks() {
    if (!linksDirty) return;
    linksDirty = false;
    const svg = document.getElementById("links");
    const board = document.querySelector(".board");
    if (!svg || !board) return;
    const boardRect = board.getBoundingClientRect();
    const rectMap = new Map();
    board.querySelectorAll(".note").forEach(sec => {
      const r = sec.getBoundingClientRect();
      rectMap.set(sec.dataset.id, {
        left: r.left - boardRect.left, top: r.top - boardRect.top,
        width: r.width, height: r.height
      });
    });
    const { edges } = connectionModel();
    const defs = svgEl("defs");
    const groups = [];
    edges.forEach((edge, i) => {
      const r1 = rectMap.get(edge.a), r2 = rectMap.get(edge.b);
      if (!r1 || !r2) return;
      const color = connColor(edge.hue);
      const mid = "arrow-" + i;
      defs.append(makeMarker(mid, color));
      const cls = edge.type === "m" ? "edge-manual" : "edge-tag";
      const g = makeEdge(r1, r2, cls, "url(#" + mid + ")", edge.srcId, edge.tid, color);
      const isNew = (prevEdgeKeys != null && !prevEdgeKeys.has(edge.key)) || edge.key === justLinked;
      if (isNew) g.classList.add("edge-new");
      groups.push({ key: edge.key, g });
    });
    prevEdgeKeys = new Set(groups.map(e => e.key));
    justLinked = null;
    svg.replaceChildren(defs, ...groups.map(e => e.g));
  }

  function deleteLink(srcId, tid) {
    const src = notes.find(n => n.id === srcId);
    if (!src) return;
    if (!confirm("¿Eliminar esta conexión?")) return;
    src.links = src.links.filter(x => x !== tid);
    save();
    render();
  }

  function updateConnectClasses() {
    document.querySelectorAll(".note").forEach(s => {
      const id = s.dataset.id;
      s.classList.toggle("is-origin", id === connectingSource);
      s.classList.toggle("is-target", connectingSource != null && id !== connectingSource);
    });
    document.querySelectorAll(".note-connect").forEach(b => {
      b.setAttribute("aria-pressed", String(b.dataset.connect === connectingSource));
    });
  }

  function enterConnectMode(id) {
    connectingSource = id;
    document.getElementById("notes").classList.add("connecting");
    announce("Selecciona la lista de destino…");
    updateConnectClasses();
    document.addEventListener("mousedown", connectCapture, true);
    document.addEventListener("click", connectCapture, true);
    scheduleLinks();
  }

  function exitConnectMode() {
    if (connectingSource == null) return;
    const origin = connectingSource;
    connectingSource = null;
    document.getElementById("notes").classList.remove("connecting");
    updateConnectClasses();
    document.removeEventListener("mousedown", connectCapture, true);
    document.removeEventListener("click", connectCapture, true);
    const btn = document.getElementById("connect-" + origin);
    if (btn) btn.focus();
    scheduleLinks();
  }

  function connectCapture(e) {
    if (connectingSource == null) return;
    const section = e.target.closest ? e.target.closest(".note") : null;
    if (e.type === "mousedown") {
      if (section) { e.preventDefault(); e.stopPropagation(); }
      return;
    }
    if (!section) { e.preventDefault(); e.stopPropagation(); exitConnectMode(); return; }
    if (section.dataset.id === connectingSource && e.target.closest && e.target.closest(".note-connect")) {
      e.preventDefault(); e.stopPropagation(); exitConnectMode(); return;
    }
    e.preventDefault(); e.stopPropagation();
    const targetId = section.dataset.id;
    if (targetId === connectingSource) return;
    const src = notes.find(n => n.id === connectingSource);
    if (src && !src.links.includes(targetId)) {
      src.links.push(targetId);
      justLinked = "m:" + pairKey(src.id, targetId);
      save();
    }
    exitConnectMode();
    render();
  }

  // ---------- Vista: cuadrícula / mapa ----------
  let drag = null;

  function updateStats() {
    const { edges } = connectionModel();
    const s = document.getElementById("stats");
    if (s) s.textContent = `${notes.length} ${notes.length === 1 ? "lista" : "listas"} · ${edges.length} ${edges.length === 1 ? "conexión" : "conexiones"}`;
  }

  // Ajusta la altura de los ítems al contenido para que el texto largo se vea entero.
  function growItems() {
    document.querySelectorAll(".item-text, .note-title").forEach(t => { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; });
  }

  // Mide la cuadrícula actual y asigna posiciones a las notas que no tengan.
  function initMapPositions() {
    const main = document.getElementById("notes");
    if (!main) return;
    const m = main.getBoundingClientRect();
    notes.forEach(n => {
      if (n.pos) return;
      const sec = main.querySelector('.note[data-id="' + CSS.escape(n.id) + '"]');
      if (!sec) return;
      const r = sec.getBoundingClientRect();
      n.pos = { x: Math.max(0, r.left - m.left), y: Math.max(0, r.top - m.top) };
    });
  }

  function layoutCanvas() {
    const main = document.getElementById("notes");
    const board = document.querySelector(".board");
    if (!main || !board) return;
    if (viewMode !== "map") {
      main.style.removeProperty("--canvas-w"); main.style.removeProperty("--canvas-h");
      board.style.width = ""; board.style.height = ""; board.classList.remove("map");
      return;
    }
    let maxR = 0, maxB = 0;
    main.querySelectorAll(".note").forEach(sec => {
      const n = notes.find(x => x.id === sec.dataset.id);
      if (!n || !n.pos) return;
      maxR = Math.max(maxR, n.pos.x + sec.offsetWidth);
      maxB = Math.max(maxB, n.pos.y + sec.offsetHeight);
    });
    const w = Math.max(main.clientWidth, maxR + 40);
    const h = Math.max(window.innerHeight - board.offsetTop, maxB + 40);
    main.style.setProperty("--canvas-w", w + "px");
    main.style.setProperty("--canvas-h", h + "px");
    board.style.width = w + "px"; board.style.height = h + "px";
    board.classList.add("map");
  }

  function setView(mode, persist) {
    const next = mode === "map" ? "map" : "grid";
    if (next === "map" && viewMode !== "map") { initMapPositions(); save(); }
    viewMode = next;
    if (persist) { try { localStorage.setItem(VIEW_KEY, viewMode); } catch (e) {} }
    const g = document.getElementById("view-grid"), mp = document.getElementById("view-map");
    if (g) g.setAttribute("aria-pressed", String(viewMode === "grid"));
    if (mp) mp.setAttribute("aria-pressed", String(viewMode === "map"));
    render();
    announce(viewMode === "map" ? "Vista mapa. Usa el asa para mover cada lista." : "Vista cuadrícula");
  }

  function moveNote(sec, note, x, y) {
    note.pos = { x: Math.max(0, Math.round(x)), y: Math.max(0, Math.round(y)) };
    sec.style.left = note.pos.x + "px"; sec.style.top = note.pos.y + "px";
    scheduleLinks();
  }

  function onGripDown(e, note, sec) {
    if (viewMode !== "map" || connectingSource != null) return;
    e.preventDefault(); e.stopPropagation();
    try { sec.setPointerCapture(e.pointerId); } catch (err) {}
    drag = { note, sec, pid: e.pointerId, sx: e.clientX, sy: e.clientY, ox: note.pos.x, oy: note.pos.y, moved: false };
    sec.classList.add("dragging");
  }
  function onDragMove(e) {
    if (!drag || e.pointerId !== drag.pid) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.moved && Math.hypot(dx, dy) > 3) drag.moved = true;
    moveNote(drag.sec, drag.note, drag.ox + dx, drag.oy + dy);
  }
  function onDragEnd(e) {
    if (!drag || e.pointerId !== drag.pid) return;
    drag.sec.classList.remove("dragging");
    if (drag.moved) {
      save(); layoutCanvas(); scheduleLinks();
      announce("Lista movida a " + Math.round(drag.note.pos.x) + ", " + Math.round(drag.note.pos.y));
    }
    drag = null;
  }
  function onGripKey(e, note, sec) {
    const step = e.shiftKey ? 32 : 8;
    const d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
    if (!d) return;
    e.preventDefault();
    moveNote(sec, note, note.pos.x + d[0], note.pos.y + d[1]);
    save(); layoutCanvas();
    announce("Movida a " + Math.round(note.pos.x) + ", " + Math.round(note.pos.y));
  }

  // ---------- Render ----------
  function render(focusId) {
    const root = document.getElementById("notes");
    computeTagCounts();
    if (notes.length === 0) {
      root.replaceChildren(el("p", { className: "empty" }, [
        el("strong", { textContent: "Sin listas todavía" }),
        document.createTextNode("Pulsa \"+ Nueva lista\" para empezar.")
      ]));
    } else {
      root.replaceChildren(...notes.map(renderNote));
    }
    if (viewMode === "map" && notes.some(n => !n.pos)) { initMapPositions(); save(); }
    root.classList.toggle("map-mode", viewMode === "map");
    if (viewMode === "map") {
      root.querySelectorAll(".note").forEach(sec => {
        const n = notes.find(x => x.id === sec.dataset.id);
        if (n && n.pos) { sec.style.left = n.pos.x + "px"; sec.style.top = n.pos.y + "px"; }
      });
      layoutCanvas();
    } else {
      layoutCanvas();
    }
    if (focusId) document.getElementById(focusId)?.focus();
    updateConnectClasses();
    applyAllStyles();
    scheduleLinks();
    observeNotes();
    updateStats();
    growItems();
    if (popFocusKey) {
      const t = document.querySelector('[data-pop-key="' + popFocusKey + '"]');
      popFocusKey = null;
      if (t) t.focus();
    }
  }

  function renderNote(note) {
    const title = el("textarea", {
      id: "title-" + note.id, rows: 1, className: "note-title",
      value: note.title, placeholder: "Sin título", "aria-label": "Título de la lista",
      oninput: e => { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; },
      onchange: e => { note.title = e.target.value.trim(); save(); scheduleLinks(); },
      onkeydown: e => { if (e.key === "Enter") { e.preventDefault(); e.target.blur(); } }
    });

    const styleBtn = el("button", {
      id: "style-" + note.id, type: "button",
      className: "icon-btn note-design",
      "aria-haspopup": "dialog", "aria-expanded": String(openPopId === note.id),
      "aria-label": "Estilo y fondo de la lista",
      onclick: e => { e.stopPropagation(); openPop(note); }
    }, [icon("i-palette")]);

    const connectBtn = el("button", {
      id: "connect-" + note.id, type: "button",
      className: "icon-btn note-connect",
      "aria-pressed": String(connectingSource === note.id),
      "aria-label": "Conectar con otra lista",
      "data-connect": note.id,
      onclick: e => { e.stopPropagation(); toggleConnect(note); }
    }, [icon("i-link")]);

    const grip = el("button", {
      type: "button", className: "icon-btn note-grip",
      "aria-label": "Mover lista", "aria-describedby": "grip-help",
      disabled: viewMode !== "map",
      onpointerdown: e => onGripDown(e, note, section),
      onkeydown: e => onGripKey(e, note, section)
    }, [icon("i-grip")]);

    const delNote = el("button", {
      className: "icon-btn", title: "Eliminar lista", "aria-label": "Eliminar lista",
      onclick: () => {
        if (!confirm(`¿Eliminar "${note.title || "Sin título"}"?`)) return;
        const bg = note.bgId;
        notes = notes.filter(n => n !== note);
        notes.forEach(n => { n.links = n.links.filter(id => id !== note.id); });
        if (openPopId === note.id) openPopId = null;
        save();
        revokeIfUnused(bg);
        render();
      }
    }, [icon("i-x")]);

    const tags = el("input", {
      type: "text", className: "note-tags",
      value: note.tags.join(", "),
      placeholder: "tags separados por coma",
      "aria-label": "Etiquetas de la lista",
      onchange: e => { note.tags = parseTags(e.target.value); save(); render(); }
    });

    const chips = note.tags.length ? el("div", { className: "tag-chips", "aria-hidden": "true" },
      note.tags.map(t => {
        const chip = el("span", { className: "tag-chip", textContent: t });
        chip.style.setProperty("--tag-h", tagHue(t));
        return chip;
      })
    ) : null;
    if (chips) chips.addEventListener("click", () => tags.focus());

    const pending = note.items.filter(i => !i.done);
    const done = note.items.filter(i => i.done);

    const addInput = el("input", {
      id: "add-" + note.id, type: "text", className: "add-input",
      placeholder: "+ Añadir elemento", "aria-label": "Añadir elemento",
      autocomplete: "off", enterkeyhint: "enter",
      onchange: () => submitAdd()
    });
    // Añade el elemento escrito. Compartido por keydown, submit y change (blur): en
    // móvil la tecla Enter/Go no siempre emite keydown, pero sí dispara submit; y si
    // el usuario sale del campo sin pulsar Enter, el change lo guarda igualmente.
    // Inserta el nodo directamente en vez de re-renderizar la nota: así se conserva
    // el foco (teclado móvil) y no se interrumpe el clic que provocó el blur.
    function submitAdd() {
      const text = addInput.value.trim();
      if (!text) return;
      const item = { id: uid(), text, done: false };
      note.items.push(item);
      addInput.value = "";
      add.parentNode.insertBefore(renderItem(note, item), add);
      save(); scheduleLinks(); growItems();
    }
    const add = el("form", {
      className: "add-form",
      onsubmit: e => { e.preventDefault(); submitAdd(); }
    }, [addInput]);
    addInput.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); submitAdd(); }
    });

    const children = [
      el("div", { className: "note-head" }, [grip, title, styleBtn, connectBtn, delNote]),
      tags,
      ...(chips ? [chips] : []),
      ...pending.map(item => renderItem(note, item)),
      add
    ];

    if (done.length) {
      const open = note.showDone !== false;
      const bar = el("div", { className: "done-bar" }, [
        el("button", {
          className: "toggle", "aria-expanded": String(open),
          textContent: `${open ? "▾" : "▸"} Completados (${done.length})`,
          onclick: () => { note.showDone = !open; save(); render(); }
        }),
        el("button", {
          className: "clear", textContent: "Borrar completados",
          onclick: () => { note.items = note.items.filter(i => !i.done); save(); render(); }
        })
      ]);
      children.push(bar);
      if (open) children.push(...done.map(item => renderItem(note, item)));
    }

    const section = el("section", {
      className: "note" + (openPopId === note.id ? " pop-open" : ""),
      "data-id": note.id,
      "aria-label": note.title || "Lista sin título"
    }, children);
    section.addEventListener("pointermove", onDragMove);
    section.addEventListener("pointerup", onDragEnd);
    section.addEventListener("pointercancel", onDragEnd);

    if (openPopId === note.id) section.append(renderPop(note, section));
    return section;
  }

  function renderItem(note, item) {
    const cb = el("input", {
      type: "checkbox", checked: item.done, "aria-label": "Marcar como completado",
      onchange: e => { item.done = e.target.checked; save(); render(); }
    });

    const text = el("textarea", {
      className: "item-text", rows: 1, "aria-label": "Texto del elemento",
      onchange: e => {
        const t = e.target.value.trim();
        if (t) { item.text = t; save(); }
        else { note.items = note.items.filter(i => i !== item); save(); render(); }
      },
      oninput: e => { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; },
      onkeydown: e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); e.target.blur(); } }
    });
    text.value = item.text;

    const del = el("button", {
      className: "icon-btn", title: "Eliminar elemento", "aria-label": "Eliminar elemento",
      onclick: () => { note.items = note.items.filter(i => i !== item); save(); render(); }
    }, [icon("i-x")]);

    return el("div", { className: "item" + (item.done ? " done" : "") }, [cb, text, del]);
  }

  // ---------- Popover de estilo ----------
  function openPop(note) {
    if (openPopId === note.id) {
      openPopId = null;
      render();
      document.getElementById("style-" + note.id)?.focus();
      return;
    }
    openPopId = note.id;
    popFocusKey = note.color == null ? "color-none" : "color-" + note.color;
    render();
  }

  function closePop() {
    if (openPopId == null) return;
    const id = openPopId;
    openPopId = null;
    render();
    document.getElementById("style-" + id)?.focus();
  }

  function toggleConnect(note) {
    if (connectingSource === note.id) { exitConnectMode(); return; }
    if (openPopId != null) { openPopId = null; render(); }
    enterConnectMode(note.id);
  }

  function renderPop(note, section) {
    const pop = el("div", { className: "pop", role: "dialog", "aria-label": "Estilo y conexiones" });
    pop.addEventListener("click", e => e.stopPropagation());

    pop.append(el("p", { className: "pop-title", textContent: "Color" }));
    const group = el("div", { className: "swatches", role: "radiogroup", "aria-label": "Color de la lista" });
    const swatches = [];
    const noneSelected = note.color == null;
    const noneSw = el("button", {
      type: "button", role: "radio", className: "swatch swatch-none" + (noneSelected ? " selected" : ""),
      "aria-checked": String(noneSelected),
      tabIndex: noneSelected ? 0 : -1,
      "aria-label": "Sin color",
      "data-pop-key": "color-none",
      onclick: () => applyColor(null)
    });
    noneSw.style.setProperty("--sw", "#ffffff");
    swatches.push(noneSw);
    PALETTE.forEach((c, i) => {
      const selected = note.color === i;
      const sw = el("button", {
        type: "button", role: "radio", className: "swatch" + (selected ? " selected" : ""),
        "aria-checked": String(selected),
        tabIndex: selected ? 0 : -1,
        "aria-label": COLOR_NAMES[i],
        "data-pop-key": "color-" + i,
        onclick: () => applyColor(i)
      });
      sw.style.setProperty("--sw", c.bg);
      swatches.push(sw);
    });
    swatches.forEach(b => group.append(b));

    // val: null = sin color; 0..9 = índice de PALETTE
    function applyColor(val) {
      note.color = val;
      save();
      swatches.forEach((b, j) => {
        const on = val == null ? j === 0 : j === val + 1;
        b.classList.toggle("selected", on);
        b.setAttribute("aria-checked", String(on));
        b.tabIndex = on ? 0 : -1;
      });
      section.style.setProperty("--tint", tintFor(note));
      section.style.setProperty("--accent", accentFor(note));
      scheduleLinks();
    }

    group.addEventListener("keydown", e => {
      const keys = ["ArrowRight", "ArrowLeft", "ArrowUp", "ArrowDown", "Home", "End"];
      if (!keys.includes(e.key)) return;
      e.preventDefault();
      let idx = swatches.indexOf(document.activeElement);
      if (idx < 0) idx = 0;
      if (e.key === "Home") idx = 0;
      else if (e.key === "End") idx = swatches.length - 1;
      else if (e.key === "ArrowRight" || e.key === "ArrowDown") idx = (idx + 1) % swatches.length;
      else idx = (idx - 1 + swatches.length) % swatches.length;
      applyColor(idx === 0 ? null : idx - 1);
      swatches[idx].focus();
    });
    pop.append(group);

    pop.append(el("p", { className: "pop-title", textContent: "Opacidad" }));
    const slider = el("input", {
      type: "range", min: 0, max: 60, step: 1, value: note.opacity,
      className: "opacity-slider", "aria-label": "Opacidad del color",
      "data-pop-key": "opacity"
    });
    slider.setAttribute("aria-valuetext", note.opacity + "%");
    slider.addEventListener("input", () => {
      note.opacity = Number(slider.value);
      slider.setAttribute("aria-valuetext", slider.value + "%");
      section.style.setProperty("--tint", tintFor(note));
    });
    slider.addEventListener("change", () => { save(); });
    pop.append(slider);

    pop.append(el("p", { className: "pop-title", textContent: "Fondo" }));
    const fileInput = el("input", { type: "file", accept: "image/*", hidden: true });
    fileInput.addEventListener("change", async e => {
      const f = e.target.files[0];
      e.target.value = "";
      if (f) await handleBgUpload(f, note);
    });
    const imgBtn = el("button", {
      type: "button", className: "btn btn-secondary pop-btn",
      textContent: note.bgId ? "Cambiar imagen" : "Imagen",
      "data-pop-key": "image",
      onclick: () => fileInput.click()
    });
    const removeBtn = el("button", {
      type: "button", className: "btn btn-secondary pop-btn",
      textContent: "Quitar fondo", disabled: !note.bgId,
      "data-pop-key": "remove-bg",
      onclick: () => {
        const old = note.bgId;
        note.bgId = null;
        save();
        revokeIfUnused(old);
        render();
      }
    });
    const thumb = el("span", { className: "bg-thumb", "aria-hidden": "true" });
    pop.append(el("div", { className: "pop-row" }, [imgBtn, removeBtn, fileInput, thumb]));
    if (note.bgId) getImageURL(note.bgId).then(u => { if (u) thumb.style.backgroundImage = `url("${u}")`; });

    pop.append(el("p", { className: "pop-title", textContent: "Conexiones" }));
    const list = el("div", { className: "pop-links" });
    if (!note.links.length) {
      list.append(el("p", { className: "link-empty", textContent: "Sin conexiones manuales." }));
    }
    note.links.forEach(id => {
      const t = notes.find(n => n.id === id);
      const label = t ? (t.title || "Sin título") : "(lista eliminada)";
      list.append(el("div", { className: "link-row" }, [
        el("span", { className: "link-label", textContent: label }),
        el("button", {
          type: "button", className: "icon-btn",
          "aria-label": "Eliminar conexión con " + label,
          onclick: () => { note.links = note.links.filter(x => x !== id); save(); render(); }
        }, [icon("i-x")])
      ]));
    });
    pop.append(list);
    return pop;
  }

  // ---------- Redimensionado ----------
  let ro = null;
  function observeNotes() {
    if (!ro) return;
    ro.disconnect();
    const board = document.querySelector(".board");
    if (board) ro.observe(board);
    document.querySelectorAll(".note").forEach(s => ro.observe(s));
  }
  if ("ResizeObserver" in window) {
    ro = new ResizeObserver(() => scheduleLinks());
  }
  window.addEventListener("resize", () => { layoutCanvas(); growItems(); scheduleLinks(); });
  window.addEventListener("orientationchange", () => { layoutCanvas(); scheduleLinks(); });

  // ---------- Eventos globales ----------
  document.getElementById("theme-toggle").addEventListener("click", () => {
    applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark", true);
  });
  document.getElementById("view-grid").addEventListener("click", () => setView("grid", true));
  document.getElementById("view-map").addEventListener("click", () => setView("map", true));

  document.getElementById("new-note").addEventListener("click", () => {
    const note = normalizeNote({ id: uid(), title: "", items: [], showDone: true });
    if (viewMode === "map") { const k = notes.length; note.pos = { x: 24 + (k % 6) * 28, y: 24 + (k % 6) * 28 }; }
    notes.unshift(note);
    save();
    render("title-" + note.id);
  });

  document.addEventListener("click", e => {
    if (openPopId == null) return;
    if (e.target.closest && (e.target.closest(".pop") || e.target.closest(".note-design"))) return;
    closePop();
  });

  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (connectingSource != null) exitConnectMode();
    else if (openPopId != null) closePop();
  });

  // ---------- Export / Import ----------
  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => { const s = String(fr.result); resolve(s.slice(s.indexOf(",") + 1)); };
      fr.onerror = () => reject(fr.error);
      fr.readAsDataURL(blob);
    });
  }

  function base64ToBlob(data, type) {
    const chunkSize = 8192; // múltiplo de 4 para decodificar por bloques
    const slices = [];
    for (let i = 0; i < data.length; i += chunkSize) {
      const bin = atob(data.slice(i, i + chunkSize));
      const bytes = new Uint8Array(bin.length);
      for (let j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
      slices.push(bytes);
    }
    return new Blob(slices, { type: type || "application/octet-stream" });
  }

  document.getElementById("export").addEventListener("click", async () => {
    const btn = document.getElementById("export");
    btn.disabled = true;
    try {
      const images = {};
      for (const n of notes) {
        if (n.bgId && !images[n.bgId]) {
          const rec = await getImage(n.bgId).catch(() => null);
          if (rec) images[n.bgId] = { type: rec.type, name: rec.name, data: await blobToBase64(rec.blob) };
        }
      }
      const envelope = { app: "checklist", schema: 2, exportedAt: new Date().toISOString(), notes, images };
      const blob = new Blob([JSON.stringify(envelope, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = el("a", { href: url, download: `checklist-${new Date().toISOString().slice(0, 10)}.json` });
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (e) {
      alert("No se pudo exportar: " + (e && e.message ? e.message : e));
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById("import-file").addEventListener("change", async e => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());

      // Formato antiguo (v1): array plano de notas.
      if (Array.isArray(data)) {
        const valid = data.every(n => n && typeof n.id === "string" && Array.isArray(n.items));
        if (!valid) throw new Error("formato");
        if (!confirm("¿Reemplazar las listas actuales por las del archivo?")) return;
        notes = data.map(normalizeNote);
        save(); render();
        gcImages();
        return;
      }

      // Envelope versionado con imágenes embebidas.
      if (data && data.app === "checklist" && Array.isArray(data.notes)) {
        if (!confirm("¿Reemplazar las listas actuales por las del archivo?")) return;
        const idMap = {};
        const images = data.images || {};
        for (const [oldId, info] of Object.entries(images)) {
          try {
            if (!info || typeof info.data !== "string") continue;
            const blob = base64ToBlob(info.data, info.type);
            idMap[oldId] = await putImage(blob, info.name);
          } catch (err) { console.warn("imagen importada", oldId, err); }
        }
        const incoming = data.notes.map(n => normalizeNote({ ...n }));
        const ids = new Set(incoming.map(n => n.id));
        incoming.forEach(n => {
          n.bgId = (n.bgId && idMap[n.bgId]) ? idMap[n.bgId] : null;
          n.links = n.links.filter(id => ids.has(id));
        });
        notes = incoming;
        save(); render();
        gcImages();
        return;
      }

      throw new Error("formato");
    } catch (err) {
      alert("El archivo no es una copia válida de Checklist.");
      console.warn(err);
    }
  });

  // ---------- Migración / arranque ----------
  async function migrate() {
    try { await openDB(); }
    catch (e) { console.warn("IndexedDB no disponible:", e); }
    localStorage.setItem(KEY, JSON.stringify(notes));
  }

  if (navigator.storage?.persist) navigator.storage.persist();
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(err => console.warn("SW no registrado:", err));
  }

  applyTheme(document.documentElement.dataset.theme, false);
  render();
  document.getElementById("view-grid").setAttribute("aria-pressed", String(viewMode === "grid"));
  document.getElementById("view-map").setAttribute("aria-pressed", String(viewMode === "map"));
  migrate();
</script>
</body>
</html>
